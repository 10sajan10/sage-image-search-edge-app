# Sage ECR application manifest. Runtime configuration is injected as
# environment variables by pluginctl/Kubernetes; no credentials belong here.
name: "sage-image-search-edge-app"
version: "0.2.0"
description: "Persistent Sage camera ingestion and weighted hybrid image search using Ollama captions, Jina CLIP embeddings, and a fixed Qdrant collection."
keywords: "image-search,vision-language-model,semantic-search,clip,qdrant,bm25,hybrid-search,edge-ai,thor"
authors: "Sajan Neupane"
collaborators: ""
funding: ""
license: ""
homepage: "https://github.com/10sajan10/sage-image-search-edge-app"

source:
  architectures:
    - "linux/arm64"
  url: "https://github.com/10sajan10/sage-image-search-edge-app.git"
  branch: "main"
  dockerfile: "Dockerfile"

resources:
  - type: gpu

# The image defaults to the persistent ingestion role:
#   python3 main.py
#
# The same immutable image runs the separately supervised search role:
#   python3 search_api.py
#
# Sage pluginctl should deploy ingestion because it injects camera/Waggle
# configuration. Search is an ordinary Kubernetes Deployment + ClusterIP
# Service; access it initially with kubectl port-forward.
