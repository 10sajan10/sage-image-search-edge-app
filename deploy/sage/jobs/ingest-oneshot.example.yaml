---
name: image-search-ingest-h01e
plugins:
  - name: image-search-ingest-once
    pluginSpec:
      image: registry.sagecontinuum.org/USERNAME/sage-image-search-ingest:0.3.3
      selector:
        resource.gpu: "true"
      resource:
        request.memory: "8Gi"
        limit.memory: "16Gi"
      volume:
        "/opt/sage/image-search-models": "/model"
        "/var/lib/sage-image-search": "/data"
      env:
        RUN_MODE: "oneshot"
        CAPTURE_SOURCE: "camera"
        CAMERA: "{secret.image-search-ingest.CAMERA}"
        CAMERA_ID: "rtsp-main"
        NODE_ID: "H01E"
        QDRANT_URL: "http://QDRANT_PRIVATE_HOST:6333"
        COLLECTION: "edge_v4_live"
        OLLAMA_URL: "http://OLLAMA_PRIVATE_HOST:11434"
        CAPTION_MODEL: "gemma4:e2b"
        EMBED_MODEL_DIR: "/model/jina-clip-v2"
        HF_HOME: "/model/hf-cache"
        REQUIRE_GPU: "true"
        FRAME_DIR: "/data/frames"
        SPOOL_DIR: "/data/spool"
        PUBLISH_TO_BEEHIVE: "true"
        LOG_FORMAT: "json"
nodes:
  H01E: true
scienceRules:
  - 'schedule(image-search-ingest-once): cronjob("image-search-ingest-once", "*/5 * * * *")'
successCriteria:
  - WallClock(1d)
